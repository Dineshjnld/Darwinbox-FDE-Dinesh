services:
  mock-target:
    build: ./mock_target
    environment:
      MOCK_FAILURE_RATE: ${MOCK_FAILURE_RATE:-0.0}
      MOCK_FAIL_ONCE_ID: ${MOCK_FAIL_ONCE_ID:-EMP005}
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      MONGODB_URI: ${MONGODB_URI:?Set MONGODB_URI in .env before starting the production stack}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-migration_copilot}
      REQUIRE_MONGODB: ${REQUIRE_MONGODB:-true}
      MONGODB_SERVER_SELECTION_TIMEOUT_MS: ${MONGODB_SERVER_SELECTION_TIMEOUT_MS:-10000}
      CEREBRAS_API_KEY: ${CEREBRAS_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-cerebras}
      LLM_MODEL: ${LLM_MODEL:-qwen-3.8-27b}
      CEREBRAS_BASE_URL: ${CEREBRAS_BASE_URL:-https://api.cerebras.ai/v1}
      LLM_FALLBACK_PROVIDER: ${LLM_FALLBACK_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta}
      TARGET_PROVIDER: ${TARGET_PROVIDER:-mock}
      MOCK_TARGET_URL: http://mock-target:8081
      MOCK_FAILURE_RATE: ${MOCK_FAILURE_RATE:-0.0}
      MOCK_FAIL_ONCE_ID: ${MOCK_FAIL_ONCE_ID:-EMP005}
      DARWINBOX_MCP_URL: ${DARWINBOX_MCP_URL:-}
      DARWINBOX_API_URL: ${DARWINBOX_API_URL:-}
      DARWINBOX_API_KEY: ${DARWINBOX_API_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DEFAULT_TENANT_ID: ${DEFAULT_TENANT_ID:-demo-tenant}
    depends_on:
      mock-target:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:3000"
